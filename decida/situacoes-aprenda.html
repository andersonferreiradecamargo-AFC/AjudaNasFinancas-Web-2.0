<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DECIDA — Situações do APRENDA</title><style>body{font:16px system-ui;background:#f3f6fa;color:#17243a;margin:0}main{max-width:680px;margin:30px auto;padding:22px;background:white;border-radius:18px;box-shadow:0 4px 22px #10203018}button{font:inherit;cursor:pointer;border:1px solid #b7c5d6;background:white;border-radius:12px;padding:14px;text-align:left}button:focus-visible{outline:3px solid #1d6e9d}.choices{display:grid;gap:10px}button[aria-pressed=true]{border:2px solid #147c65;background:#effaf6}#feedback{background:#edf3f8;padding:16px;border-radius:12px;margin-top:16px}nav{display:flex;justify-content:space-between;margin-top:20px}nav button{background:#173e69;color:white}nav button:disabled{opacity:.45}small{color:#536478}</style></head><body><main><small>DECIDA • APRENDA • Atividade complementar experimental</small><h1 id="title"></h1><p id="story"></p><h2>O que você decide?</h2><div id="choices" class="choices"></div><section id="feedback" role="status" hidden></section><nav><button id="prev">Anterior</button><span id="progress" aria-live="polite"></span><button id="next">Próxima</button></nav><p><small>As escolhas não alteram a pontuação de 1.000 pontos do jogo financeiro.</small></p></main><script>const ITEMS=[["Mochila e publicidade","Sua mochila está em boas condições. Uma propaganda apresenta outra por R$ 180. Você tem R$ 200 guardados para materiais escolares.",["Comprar agora","Você fica com R$ 20 para os demais materiais. Verifique o que ainda precisa comprar."],["Esperar e avaliar","Você preserva recursos enquanto confere as prioridades escolares."],["Comparar alternativas","Pesquisar ajuda, mas uma compra mais barata ainda compromete parte do orçamento."]],["Passeio e orçamento","Uma família recebe R$ 3.500, prevê R$ 3.100 em despesas essenciais e deseja um passeio de R$ 500.",["Fazer o passeio","O custo supera em R$ 100 a diferença entre renda e despesas essenciais. É preciso identificar como cobrir essa diferença."],["Buscar passeio mais acessível","Você pode preservar o lazer sem ultrapassar a margem disponível."],["Planejar para outro mês","Você mantém o objetivo e pode organizar recursos para realizá-lo."]],["Tênis e necessidades","Seu tênis está desgastado. Há um modelo adequado por R$ 120 e outro popular por R$ 280. A família tem R$ 300 para essa compra e outras necessidades.",["Escolher o de R$ 280","Sobram R$ 20. Considere conforto, durabilidade e outras necessidades."],["Escolher o de R$ 120","Sobram R$ 180, desde que o modelo atenda às necessidades de uso."],["Comparar qualidade e preço","Conforto, resistência e prioridades ajudam a decidir além da marca."]],["Estojo e durabilidade","O estojo A custa R$ 20 e dura cerca de seis meses. O B custa R$ 45 e dura cerca de dezoito meses. Você tem R$ 50 para compras escolares.",["Comprar o A","O gasto imediato é menor, mas três unidades em dezoito meses custariam R$ 60, se a duração prevista se confirmar."],["Comprar o B","O custo estimado em dezoito meses é menor, mas sobram só R$ 5 agora."],["Avaliar outras despesas","O menor custo de longo prazo nem sempre cabe no orçamento imediato."]],["Troca do celular","Seu celular ainda funciona, mas está lento. Um novo custa R$ 1.800 em dez parcelas sem juros; outro, R$ 900 à vista. Você tem R$ 1.000 guardados.",["Parcelar o de R$ 1.800","Você assume dez compromissos mensais de R$ 180. Avalie o orçamento dos próximos meses."],["Comprar o de R$ 900","Você evita parcelas, mas ficam R$ 100 da quantia guardada."],["Adiar e pesquisar","Você preserva recursos enquanto o aparelho atual atende às necessidades."]]];const KEY="decida-aprenda-situacoes-v1";let answers={};try{answers=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){}let index=0;const $=id=>document.getElementById(id);function render(){const item=ITEMS[index];$("title").textContent=item[0];$("story").textContent=item[1];$("choices").replaceChildren();item.slice(2).forEach((opt,i)=>{const b=document.createElement("button");b.textContent=opt[0];b.setAttribute("aria-pressed",String(answers[index]===i));b.onclick=()=>{answers[index]=i;try{localStorage.setItem(KEY,JSON.stringify(answers))}catch(e){}render()};$("choices").append(b)});const selected=answers[index];$("feedback").hidden=selected===undefined;$("feedback").textContent=selected===undefined?"":item[selected+2][1];$("prev").disabled=index===0;$("next").disabled=index===ITEMS.length-1||selected===undefined;$("progress").textContent=(index+1)+" de "+ITEMS.length+" • "+Object.keys(answers).length+" respondidas"}$("prev").onclick=()=>{index--;render()};$("next").onclick=()=>{index++;render()};render();</script></body></html>
